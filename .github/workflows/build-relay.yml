name: Build and test relay fastpath

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm libbpf-dev libelf-dev zlib1g-dev \
            pkg-config linux-tools-common linux-tools-generic iproute2 tcpdump ppp
          tool=$(find /usr/lib -path '*/linux-tools*/*' -name bpftool -type f | sort -V | tail -1)
          test -n "$tool"
          sudo ln -sf "$tool" /usr/local/bin/bpftool
      - name: Build original datapath and optional fastpath
        run: |
          mkdir -p artifacts/linux
          cd src
          sh configure --disable-plugin
          make -j2 FASTPATH=0 pppoe-relay
          cp pppoe-relay ../artifacts/linux/pppoe-relay-userspace
          make -j2 FASTPATH=1 pppoe-relay
          cp pppoe-relay ../artifacts/linux/pppoe-relay
          ./pppoe-relay -h
          make -C ../tests
      - name: Verify BPF independently of relay control plane
        run: sudo tests/test_bpf
      - name: Real namespace tests and tcpdump duplicate checks
        run: |
          sudo python3 tests/netns.py --binary src/pppoe-relay \
            --stub-binary artifacts/linux/pppoe-relay-userspace --idle-test
      - name: Record build provenance
        if: always()
        run: |
          mkdir -p artifacts/linux
          git rev-parse HEAD > artifacts/linux/SOURCE_COMMIT
          uname -a > artifacts/linux/RUNNER_KERNEL
          cp README.md artifacts/linux/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-x86_64-relay-and-test-evidence
          path: |
            artifacts/linux/
            test-results/
          if-no-files-found: error

  openwrt:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install SDK and host BPF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm libbpf-dev libelf-dev zlib1g-dev \
            pkg-config linux-tools-common linux-tools-generic gawk gettext libncurses-dev \
            python3 rsync unzip zstd file wget curl
          tool=$(find /usr/lib -path '*/linux-tools*/*' -name bpftool -type f | sort -V | tail -1)
          test -n "$tool"
          sudo ln -sf "$tool" /usr/local/bin/bpftool
      - name: Build this repository with OpenWrt 24.10.3 x86_64 SDK
        run: bash scripts/build-openwrt.sh
      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-24.10.3-x86_64-relay-fastpath-ipk
          path: artifacts/openwrt/
          if-no-files-found: error
