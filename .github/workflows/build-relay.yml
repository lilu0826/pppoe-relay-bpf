name: Build and test pppoe-relay-bpf

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm libbpf-dev libelf-dev zlib1g-dev \
            pkg-config linux-tools-common linux-tools-generic iproute2 tcpdump
          tool=$(find /usr/lib -path '*/linux-tools*/*' -name bpftool -type f | sort -V | tail -1)
          test -n "$tool"
          sudo ln -sf "$tool" /usr/local/bin/bpftool
      - name: Build embedded BPF relay
        run: |
          make -j2
          src/pppoe-relay-bpf --help
          mkdir -p artifacts/linux
          cp src/pppoe-relay-bpf artifacts/linux/
      - name: Discovery, sessions, local coexistence, capacity and lifecycle tests
        run: sudo python3 tests/netns.py --binary src/pppoe-relay-bpf
      - name: Record build provenance
        if: always()
        run: |
          mkdir -p artifacts/linux
          git rev-parse HEAD > artifacts/linux/SOURCE_COMMIT
          uname -a > artifacts/linux/RUNNER_KERNEL
          cp README.md artifacts/linux/
      - name: Include native relay guide
        if: always()
        run: |
          cp doc/BPF-RELAY-QUICKSTART.md artifacts/linux/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-x86_64-pppoe-relay-bpf
          path: |
            artifacts/linux/
            test-results/
          if-no-files-found: error

  openwrt:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        openwrt: ["24.10", "25.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install SDK and host BPF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm libbpf-dev libelf-dev zlib1g-dev \
            pkg-config linux-tools-common linux-tools-generic gawk gettext libncurses-dev \
            python3 rsync unzip zstd file wget curl
          tool=$(find /usr/lib -path '*/linux-tools*/*' -name bpftool -type f | sort -V | tail -1)
          test -n "$tool"
          sudo ln -sf "$tool" /usr/local/bin/bpftool
      - name: Build OpenWrt ${{ matrix.openwrt }} x86_64 package
        run: bash scripts/build-openwrt.sh "${{ matrix.openwrt }}"
      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ matrix.openwrt }}-x86_64-pppoe-relay-bpf
          path: artifacts/openwrt/
          if-no-files-found: error
